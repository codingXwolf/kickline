<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#0E0F12"/>

  <!-- Icon -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="260" height="260" rx="56" fill="#171A21" stroke="#2A2F3A" stroke-width="6"/>

    <!-- Subtle rhythm line behind K -->
    <path d="M38 156 H82 L102 118 L132 186 L164 126 H222"
          stroke="#60A5FA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Improved K -->
    <g transform="translate(58,48)">
      <!-- stem -->
      <rect x="0" y="8" width="18" height="156" rx="9" fill="#F5F7FA"/>

      <!-- upper arm -->
      <path d="M22 86 L104 18"
            stroke="#F5F7FA" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- lower arm -->
      <path d="M22 86 L108 152"
            stroke="#F5F7FA" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- subtle inner cut for sharper join -->
      <circle cx="22" cy="86" r="7" fill="#171A21"/>

      <!-- drumstick tips -->
      <circle cx="110" cy="14" r="11" fill="#3B82F6"/>
      <circle cx="114" cy="156" r="11" fill="#3B82F6"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(380,125)">
    <text x="0" y="78" fill="#F5F7FA" font-size="96" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="1.5">KICKLINE</text>
    <text x="4" y="126" fill="#9AA4B2" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="400" letter-spacing="4">DRUM TRAINING APP</text>
    <rect x="2" y="150" width="320" height="8" rx="4" fill="#3B82F6"/>
  </g>
</svg>
